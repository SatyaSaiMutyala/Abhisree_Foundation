plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.adhisree_foundation"

    // MUST UPDATE compileSdk and target SDK for new AGP
    compileSdk = 35
    // ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId = "com.adhisree_foundation"
        minSdk = 23               // keep if flutter.minSdkVersion is 21
        targetSdk = 35            
        versionCode = 25
        versionName = flutter.versionName
        // 16 KB PAGE SIZE FIX → enable all architectures
        // ndk {
        //     abiFilters "arm64-v8a", "x86_64", "armeabi-v7a"
        // }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17   // REQUIRED for AGP 8+
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"   // MUST MATCH Kotlin 2.x
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            // ndk {
            //     debugSymbolLevel 'FULL'
            // }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

apply plugin: 'com.google.gms.google-services'
